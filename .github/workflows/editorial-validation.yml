name: Editorial validation
on:
  push:
    branches: [main]
    paths:
      - 'data/geography/**'
      - 'scripts/validate-editorial.js'
      - '.github/workflows/editorial-validation.yml'
  pull_request:
    paths:
      - 'data/geography/**'
      - 'scripts/validate-editorial.js'
      - '.github/workflows/editorial-validation.yml'
  workflow_dispatch:
jobs:
  validate-editorial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate geography and quiz editorial records
        run: node scripts/validate-editorial.js
